[/Script/Engine.RendererSettings]
r.DistanceFields=0

; r.Mobile.AllowFramebufferFetch=1 reverts the mobile deferred renderer from multi-pass to single-pass/Vulkan subpasses, which was the default before UE 5.7.
; Multi-pass deferred is disabled for VR Template for 5.7.1 due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1

; The PICO plugin hardcodes BLEND_TEXTURE_SOURCE_ALPHA on the projection layer (PICO_HMD.cpp
; OnEndProjectionLayer, unconditional on PICO runtime), so the compositor ALWAYS blends by the
; eye buffer's alpha. On Mobile HDR-off LDR the buffer alpha is ~1.0 (opaque); the plugin's
; default xr.OpenXRInvertAlpha=True tells the runtime to read it inverted -> 0 -> the whole
; opaque scene composites as TRANSPARENT over the white PICO home (only MSAA edges visible).
; Fix: no propagated alpha + no inversion. Values are cached at app startup - config only,
; runtime toggles do nothing. They live HERE because the open editor rewrites DefaultEngine.ini.
r.Mobile.PropagateAlpha=False

[/Script/OpenXRHMD.OpenXRHMDSettings]
xr.OpenXRInvertAlpha=False

[/Script/PICOOpenXRRuntimeSettings.PICOOpenXRRuntimeSettings]
xr.OpenXRInvertAlpha=False