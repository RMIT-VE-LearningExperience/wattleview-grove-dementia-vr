[/Script/Engine.RendererSettings]
; Disabling distance fields avoids requiring a full depth pre-pass, which is slow on standalone XR devices.
r.DistanceFields=0

; This reverts the mobile deferred renderer to single-pass/subpass rendering, which was the default before UE 5.7.
; Multi-pass deferred is currently disabled for VR Template due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1

; PSO precaching is extremely slow on first launch for standlone XR devices.
; Projects are recommended to use Bundled PSO Caches to avoid stuttering.
; Alternatively, re-enable PSO precaching and conceal it with a loading screen by querying FShaderPipelineCache::NumPrecompilesRemaining().
r.PSOPrecaching=0

; Frame synthesis (XR_EXT_frame_synthesis, which the PICO runtime supports): UE writes OpenXR
; motion vectors and marks frames "relaxed interval", so the runtime can render at half rate and
; synthesize 90 Hz when the GPU can't keep up. The room with three MetaHumans measured
; 15-28 ms of GPU per frame on the PICO 4 Ultra (90 Hz needs 11). Disables TAA/motion blur,
; which mobile MSAA doesn't use anyway.
r.Velocity.DirectlyRenderOpenXRMotionVectors=True
xr.OpenXRFrameSynthesis=True

; Foveated rendering: xr.OpenXRFBFoveationLevel only takes effect when VRS is enabled (the mobile
; base pass gets the fragment density map through the VRS image manager, which is off by default).
r.VRS.Enable=1

; No movable-shadow cascade any more (build_lighting.py), so characters would get the stationary sun
; unshadowed, even in the room's shade. One shadow-map sample per object fixes that for free.
r.Shadow.ForceSingleSampleShadowingFromStationary=1
